<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Aymen Merad</title>
  <desc id="desc">AI Engineer and Backend Developer. Sétif, Algeria. Open to work, remote.</desc>
  <style>
    @font-face { font-family: 'MontserratEmbed'; font-weight: 900; src: url(data:font/woff2;base64,) format('woff2'); }@font-face { font-family: 'MontserratEmbed'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
    .sans { font-family: MontserratEmbed, Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.5px; }
  </style>
  <rect width="1000" height="340" rx="14" fill="#0d0d0d"/>

  <!-- top bar -->
  <text x="48" y="54" class="mono" font-size="13" fill="#8a8a8a">A.MERAD — FOLIO/2026</text>
  <text x="952" y="54" text-anchor="end" class="mono" font-size="13" fill="#8a8a8a">SÉTIF, DZ · 36.19°N 5.41°E</text>
  <line x1="48" y1="72" x2="952" y2="72" stroke="#2a2a2a"/>

  <!-- name -->
  <text x="42" y="168" class="sans" font-size="92" font-weight="900" letter-spacing="-3" fill="#ffffff">AYMEN</text>
  <text x="42" y="258" class="sans" font-size="92" font-weight="900" letter-spacing="-3" fill="#0d0d0d" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">MERAD<tspan fill="#e01b1b" stroke="none">.</tspan></text>

  <!-- right column -->
  <g class="mono" font-size="14" fill="#ffffff">
    <text x="610" y="124">AI ENGINEER</text>
    <text x="610" y="152">BACKEND DEVELOPER</text>
    <text x="610" y="180">AGENTIC SYSTEMS BUILDER</text>
  </g>
  <line x1="610" y1="204" x2="952" y2="204" stroke="#2a2a2a"/>
  <circle cx="616" cy="232" r="5" fill="#e01b1b">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="632" y="237" class="mono" font-size="14" fill="#ffffff">OPEN TO WORK · SÉTIF → REMOTE</text>

  <!-- tagline -->
  <line x1="48" y1="290" x2="952" y2="290" stroke="#2a2a2a"/>
  <text x="48" y="318" class="sans" font-size="17" fill="#8a8a8a">I make backends behave <tspan fill="#e01b1b">&amp;</tspan> frontends feel.</text>
  <text x="952" y="318" text-anchor="end" class="mono" font-size="12" fill="#8a8a8a">AI ENGINEERING / AGENTS / BACKEND</text>
</svg>
